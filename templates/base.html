<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if auth_csrf_token %}<meta name="gremlin-csrf-token" content="{{ auth_csrf_token }}">{% endif %}
  <meta name="gremlin-can-edit" content="{{ 'true' if auth_can_edit else 'false' }}">
  <title>{{ page_title or "GREMLIN" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <script>
    // Applied before first paint so a collapsed sidebar does not flash open on
    // every page load. layout.js takes over once the toggle button exists.
    try {
      if (localStorage.getItem("gremlin.sidebar.collapsed") === "true") {
        document.body.classList.add("sidebar-collapsed");
      }
    } catch (e) {}
  </script>
  <div class="app-layout" id="appLayout">
    {% include "topbar.html" %}
    {% include "sidebar.html" %}
    <main class="content" role="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/layout.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
